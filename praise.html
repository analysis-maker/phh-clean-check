<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="phh-build" content="20261112035922"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5bbfb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clean Check">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<script>window.PHH_PRAISE_API = "https://rxhpnowszmetjxbwylil" + ".supabase.co/functions/v1/praise-api";</script>
<title>Kind words from your guests</title>
<!-- 12 Nov 2026 (Ian): guest praise. Opened from the "5 out of 5 for cleanliness" notification (praise-api /praise-run).
     Shows the new 5 out of 5 reviews first, then the housekeeper's kind words from the last 90 days. No scores, no ranks. -->
<style>
:root{color-scheme:light;--teal:#5bbfb5;--teal-ink:#23807a;--ink:#26323a;--muted:#5d6b73;--line:#e1e5e7;--bg:#f4f5f5;--gold:#f2b01e;--gold-bg:#fff7e3}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Helvetica Neue",Arial,sans-serif}
.top{background:var(--teal);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
.top img{width:28px;height:28px;border-radius:6px;background:#fff;padding:2px}
main{max-width:560px;margin:0 auto;padding:18px 16px 48px}
.hero{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 20px 18px;text-align:center}
.hero .stars{color:var(--gold);font-size:34px;letter-spacing:4px;line-height:1}
.hero h1{font-size:25px;line-height:1.25;margin:12px 0 6px}
.hero p{color:var(--muted);margin:0}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 4px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 12px;position:relative}
.card.new{border-color:var(--gold);background:linear-gradient(#fff,#fff) padding-box;box-shadow:0 0 0 1px var(--gold) inset}
.badge{position:absolute;top:14px;right:14px;background:var(--gold-bg);color:#8a5a00;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.prop{font-weight:700;font-size:18px;margin:0 60px 2px 0}
.rate{color:var(--muted);font-size:14px;margin:0 0 10px}
.rate b{color:var(--gold);font-weight:400;letter-spacing:1px}
.quote{font-size:19px;line-height:1.45;margin:0;font-style:italic}
.quote::before{content:"\201C"}.quote::after{content:"\201D"}
.plain{margin:0;color:var(--ink)}
.when{color:var(--muted);font-size:13px;margin:10px 0 0}
.thanks{text-align:center;color:var(--muted);margin:22px 8px 0}
.btn{display:block;text-align:center;margin-top:16px;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;padding:14px;border-radius:8px}
.err{color:#b2461d}
</style>
<script>
/* Self-update (tools/bump_build.py): if this copy is older than the live page, reopen it fresh.
   Runs on open, whenever the app comes back to the front (iPhone keeps Home Screen apps suspended), and every 10 minutes. */
(function(){
  try{
    var me = document.querySelector('meta[name="phh-build"]'); if(!me || !window.fetch) return;
    var b = me.getAttribute("content"), busy = false, last = 0;
    function check(){
      if(busy || Date.now() - last < 20000) return; busy = true; last = Date.now();
      var sep = location.search ? "&" : "?";
      fetch(location.pathname + location.search + sep + "_chk=" + Date.now(), { cache: "no-store", credentials: "same-origin" })
        .then(function(r){ return r.ok ? r.text() : ""; })
        .then(function(t){
          busy = false;
          var m = /name="phh-build" content="([0-9]+)"/.exec(t || ""); if(!m || m[1] <= b) return;
          var key = "phh-upd-" + m[1]; try{ if(sessionStorage.getItem(key)) return; sessionStorage.setItem(key, "1"); }catch(x){}
          var q = (location.search || "").replace(/([?&])_v=[^&]*&?/, "$1").replace(/[?&]$/, "");
          location.replace(location.pathname + q + (q ? "&" : "?") + "_v=" + m[1] + location.hash);
        }).catch(function(){ busy = false; });
    }
    check();
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") check(); });
    window.addEventListener("pageshow", function(e){ if(e.persisted) check(); });
    window.addEventListener("focus", check);
    setInterval(function(){ if(document.visibilityState === "visible") check(); }, 600000);
  }catch(e){}
})();
</script>
</head>
<body>
<div class="top"><img src="icon-180.png" alt="">Professional Holiday Homes</div>
<main>
  <div class="hero">
    <div class="stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
    <h1 id="h1">Guests noticed your work</h1>
    <p id="sub">Loading...</p>
  </div>
  <h2 id="newH" hidden>New</h2>
  <div id="newList"></div>
  <h2 id="oldH" hidden>Earlier kind words</h2>
  <div id="oldList"></div>
  <p class="thanks" id="thanks" hidden>Every 5 out of 5 is down to the care you put into each clean. Thank you from all of us at Professional Holiday Homes.</p>
  <a class="btn" href="./">Open Clean Check</a>
</main>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var t = new URLSearchParams(location.search).get("t") || "";
  if(!/^[0-9a-f]{32}$/.test(t)){ $("sub").innerHTML = '<span class="err">This link is not complete.</span>'; return; }
  var el = function(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; };
  var day = function(s){ return new Date(s).toLocaleDateString("en-AU", { weekday:"short", day:"numeric", month:"short", timeZone:"Australia/Sydney" }); };
  var site = function(s){ s = String(s || "").toLowerCase(); return s === "airbnb" ? "Airbnb" : s === "booking" || s === "bookingcom" ? "Booking.com" : s === "vrbo" || s === "stayz" ? "Stayz" : s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; };
  function card(it){
    var c = el("div", "card" + (it.isNew ? " new" : ""));
    if(it.isNew) c.appendChild(el("span", "badge", "New"));
    c.appendChild(el("p", "prop", it.property || "Your clean"));
    var r = el("p", "rate"); var b = el("b", "", "\u2605\u2605\u2605\u2605\u2605"); r.appendChild(b); r.appendChild(document.createTextNode(" Cleanliness 5 out of 5")); c.appendChild(r);
    if(it.quote) c.appendChild(el("p", "quote", it.quote));
    else c.appendChild(el("p", "plain", "Full marks for cleanliness. Great job."));
    c.appendChild(el("p", "when", "Guest review, " + day(it.reviewAt) + (site(it.source) ? " (" + site(it.source) + ")" : "")));
    return c;
  }
  fetch(window.PHH_PRAISE_API + "/praise-open", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ t: t }) })
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || "Not available"); return j; }); })
    .then(function(j){
      var items = j.items || [], fresh = items.filter(function(x){ return x.isNew; }), old = items.filter(function(x){ return !x.isNew; });
      var n = fresh.length;
      $("sub").textContent = (j.name ? "Hi " + j.name + ", " : "") + (n === 1 ? "a guest rated the cleanliness 5 out of 5." : n + " guests rated the cleanliness 5 out of 5.");
      fresh.forEach(function(x){ $("newList").appendChild(card(x)); });
      old.forEach(function(x){ $("oldList").appendChild(card(x)); });
      $("newH").hidden = !n || !old.length; $("oldH").hidden = !old.length; $("thanks").hidden = false;
    })
    .catch(function(e){ $("sub").innerHTML = '<span class="err">' + String(e.message).replace(/[<>&]/g, "") + "</span>"; });
})();
</script>
</body></html>
