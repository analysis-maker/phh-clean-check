  var f = location.pathname.replace(/^\/checkcleaning-staging\/?/, "") || "index.html";

<meta name="phh-build" content="20261112041527"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">

<title>Mark handled</title>
<!-- 12 Nov 2026 (Bella via Ian): mark a #cleancheck-attention item as handled. Opened from the "Mark handled" link in the Slack post.
     Office staff code + a few words on what was done. rpc qa_attention_handle_get / qa_attention_handle (migration v50).
     n8n Attention to Slack then replies in the Slack thread "Handled by <name>: <note>" and adds a tick. -->
<style>
:root{color-scheme:light;--teal:#5bbfb5;--teal-ink:#23807a;--ink:#26323a;--muted:#5d6b73;--line:#e1e5e7;--bg:#f4f5f5;--ok:#2f7d4f;--ok-bg:#e7f5ec}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Helvetica Neue",Arial,sans-serif}
.top{background:var(--teal);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
.top img{width:28px;height:28px;border-radius:6px;background:#fff;padding:2px}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:14px}
.kind{color:var(--muted);font-size:14px;margin:0 0 4px}
h1{font-size:22px;line-height:1.3;margin:0 0 6px}
.when{color:var(--muted);font-size:14px;margin:0}
label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #c9d1d5;border-radius:8px;background:#fff}
textarea{min-height:96px;resize:vertical}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.btn{display:block;width:100%;text-align:center;margin-top:16px;background:var(--teal);color:#fff;border:0;font:inherit;font-weight:600;padding:14px;border-radius:8px;cursor:pointer}
.btn[disabled]{opacity:.6}
.done{background:var(--ok-bg);border:1px solid #b9dfc6;border-radius:10px;padding:16px 18px;color:var(--ok)}
.done b{display:block;font-size:18px;margin-bottom:4px}
.done p{margin:4px 0 0;color:var(--ink)}
.err{color:#b2461d;margin:10px 0 0}
.link{color:var(--teal-ink)}
</style>
<script>
/* Self-update (tools/bump_build.py): if this copy is older than the live page, reopen it fresh.
   Runs on open, whenever the app comes back to the front (iPhone keeps Home Screen apps suspended), and every 10 minutes. */
(function(){
  try{
    var me = document.querySelector('meta[name="phh-build"]'); if(!me || !window.fetch) return;
    var b = me.getAttribute("content"), busy = false, last = 0;
    function check(){
      if(busy || Date.now() - last < 20000) return; busy = true; last = Date.now();
      var sep = location.search ? "&" : "?";
      fetch(location.pathname + location.search + sep + "_chk=" + Date.now(), { cache: "no-store", credentials: "same-origin" })
        .then(function(r){ return r.ok ? r.text() : ""; })
        .then(function(t){
          busy = false;
          var m = /name="phh-build" content="([0-9]+)"/.exec(t || ""); if(!m || m[1] <= b) return;
          var key = "phh-upd-" + m[1]; try{ if(sessionStorage.getItem(key)) return; sessionStorage.setItem(key, "1"); }catch(x){}
          var q = (location.search || "").replace(/([?&])_v=[^&]*&?/, "$1").replace(/[?&]$/, "");
          location.replace(location.pathname + q + (q ? "&" : "?") + "_v=" + m[1] + location.hash);
        }).catch(function(){ busy = false; });
    }
    check();
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") check(); });
    window.addEventListener("pageshow", function(e){ if(e.persisted) check(); });
    window.addEventListener("focus", check);
    setInterval(function(){ if(document.visibilityState === "visible") check(); }, 600000);
  }catch(e){}
})();
</script>
</head>
<body>
<div class="top"><img src="icon-180.png" alt="">Professional Holiday Homes</div>
<main>
  <div class="card">
    <p class="kind" id="kind">Loading...</p>
    <h1 id="title" hidden></h1>
    <p class="when" id="when"></p>
    <p class="when" id="open" hidden><a class="link" id="openA" href="#">Open the clean check</a></p>
  </div>
  <div class="done" id="done" hidden><b id="doneBy"></b><p id="doneNote"></p></div>
  <form class="card" id="form" hidden>
    <label for="note">What was done</label>
    <textarea id="note" maxlength="300" placeholder="e.g. Called the guest, 2 extra guests charged $80 in HomHero"></textarea>
    <label for="code">Your office code</label>
    <input id="code" inputmode="numeric" autocomplete="off" maxlength="10">
    <p class="hint">Your name goes on it, so everyone can see who sorted it.</p>
    <button class="btn" id="go" type="submit">Mark handled</button>
    <p class="err" id="err" hidden></p>
  </form>
</main>
<script>
(function(){
  var SB = "https://rxhpnowszmetjxbwylil" + ".supabase.co", KEY = "sb_publishable_JaFEZTFufkk0hrminCZdXQ_fQFJ0kLb";
  var $ = function(id){ return document.getElementById(id); };
  var t = new URLSearchParams(location.search).get("t") || "";
  var rpc = function(name, body){ return fetch(SB + "/rest/v1/rpc/" + name, { method:"POST", headers:{ "content-type":"application/json", apikey: KEY }, body: JSON.stringify(body) })
    .then(function(r){ if(!r.ok) throw new Error("Could not reach Clean Check. Try again in a minute."); return r.json(); }); };
  var when = function(s){ return new Date(s).toLocaleString("en-AU", { weekday:"short", day:"numeric", month:"short", hour:"numeric", minute:"2-digit", timeZone:"Australia/Sydney" }); };
  var KIND = { ai:"AI photo review", note:"Note to the office from the housekeeper", guests:"More guests than booked" };
  function showDone(j){
    $("form").hidden = true; $("done").hidden = false;
    $("doneBy").textContent = "\u2713 Handled by " + j.handledBy + ", " + when(j.handledAt);
    $("doneNote").textContent = j.note || "";
  }
  try{ var saved = localStorage.getItem("phh-staff-code"); if(saved) $("code").value = saved; }catch(e){}
  if(!/^[0-9a-f]{32}$/.test(t)){ $("kind").textContent = "This link is not complete."; return; }
  rpc("qa_attention_handle_get", { p_token: t }).then(function(j){
    if(!j || !j.ok){ $("kind").textContent = (j && j.error) || "Not available."; return; }
    $("kind").textContent = (KIND[j.kind] || "Needs attention") + (j.test ? " (test)" : "");
    $("title").textContent = j.title || ("Booking " + (j.res || "")); $("title").hidden = false;
    if(j.postedAt) $("when").textContent = "Posted " + when(j.postedAt);
    if(j.res){ $("openA").href = "office.html?open=" + encodeURIComponent(j.res); $("open").hidden = false; }
    if(j.handledAt) showDone(j); else $("form").hidden = false;
  }).catch(function(e){ $("kind").textContent = e.message; });
  $("form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var note = $("note").value.trim(), code = $("code").value.replace(/\s+/g, "");
    $("err").hidden = true;
    if(note.length < 3){ $("err").textContent = "Add a few words on what was done."; $("err").hidden = false; return; }
    if(!/^\d{4,10}$/.test(code)){ $("err").textContent = "Enter your office code."; $("err").hidden = false; return; }
    $("go").disabled = true;
    rpc("qa_attention_handle", { p_token: t, p_code: code, p_note: note }).then(function(j){
      if(j && j.ok){ try{ localStorage.setItem("phh-staff-code", code); }catch(e){} showDone(j);
        $("doneNote").textContent = j.note + "  (It shows in #cleancheck-attention within 10 minutes.)"; return; }
      if(j && j.handledBy){ showDone(j); return; }
      $("err").textContent = (j && j.error) || "Could not save."; $("err").hidden = false; $("go").disabled = false;
    }).catch(function(e){ $("err").textContent = e.message; $("err").hidden = false; $("go").disabled = false; });
  });
})();
</script>
</body></html>
