<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="phh-build" content="20261030004834"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5bbfb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clean Check">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<script>window.PHH_ADMIN_API = "https://rxhpnowszmetjxbwylil" + ".supabase.co/functions/v1/admin-api";</script>
<title>Message from PHH</title>
<style>
:root{color-scheme:light;--teal:#5bbfb5;--teal-ink:#23807a;--ink:#26323a;--muted:#5d6b73;--line:#e1e5e7;--bg:#f4f5f5}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Helvetica Neue",Arial,sans-serif}
.top{background:var(--teal);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
.top img{width:28px;height:28px;border-radius:6px;background:#fff;padding:2px}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}
.from{color:var(--muted);font-size:14px;margin:0 0 6px}
h1{font-size:24px;line-height:1.25;margin:0 0 12px}
.body{white-space:pre-wrap;margin:0 0 16px}
.when{color:var(--muted);font-size:14px;margin:0}
.btn{display:block;text-align:center;margin-top:18px;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;padding:14px;border-radius:8px}
.err{color:#b2461d}
</style>
<script>
/* Self-update (tools/bump_build.py): if this copy is older than the live page, reopen it fresh.
   Runs on open, whenever the app comes back to the front (iPhone keeps Home Screen apps suspended), and every 10 minutes. */
(function(){
  try{
    var me = document.querySelector('meta[name="phh-build"]'); if(!me || !window.fetch) return;
    var b = me.getAttribute("content"), busy = false, last = 0;
    function check(){
      if(busy || Date.now() - last < 20000) return; busy = true; last = Date.now();
      var sep = location.search ? "&" : "?";
      fetch(location.pathname + location.search + sep + "_chk=" + Date.now(), { cache: "no-store", credentials: "same-origin" })
        .then(function(r){ return r.ok ? r.text() : ""; })
        .then(function(t){
          busy = false;
          var m = /name="phh-build" content="([0-9]+)"/.exec(t || ""); if(!m || m[1] <= b) return;
          var key = "phh-upd-" + m[1]; try{ if(sessionStorage.getItem(key)) return; sessionStorage.setItem(key, "1"); }catch(x){}
          var q = (location.search || "").replace(/([?&])_v=[^&]*&?/, "$1").replace(/[?&]$/, "");
          location.replace(location.pathname + q + (q ? "&" : "?") + "_v=" + m[1] + location.hash);
        }).catch(function(){ busy = false; });
    }
    check();
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") check(); });
    window.addEventListener("pageshow", function(e){ if(e.persisted) check(); });
    window.addEventListener("focus", check);
    setInterval(function(){ if(document.visibilityState === "visible") check(); }, 600000);
  }catch(e){}
})();
</script>
</head>
<body>
<div class="top"><img src="icon-180.png" alt="">Professional Holiday Homes</div>
<main>
  <div class="card" id="card">
    <p class="from" id="from">Loading your message...</p>
    <h1 id="title" hidden></h1>
    <p class="body" id="body" hidden></p>
    <p class="when" id="when"></p>
    <div id="guides" hidden style="margin-top:14px"><a class="btn" style="background:#fff;color:#23807a;border:1px solid #5bbfb5" id="gpdf" target="_blank" rel="noopener">How It Works guide (PDF)</a><a class="btn" style="background:#fff;color:#23807a;border:1px solid #5bbfb5" id="gvid" target="_blank" rel="noopener">How It Works video</a></div>
    <a class="btn" href="./">Open Clean Check</a>
  </div>
</main>
<script>
(function(){
  var t = new URLSearchParams(location.search).get("t") || "";
  var $ = function(id){ return document.getElementById(id); };
  if(!/^[0-9a-f]{32}$/.test(t)){ $("from").innerHTML = '<span class="err">This message link is not complete.</span>'; return; }
  fetch(window.PHH_ADMIN_API + "/msg-open", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ t: t }) })
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || "Not available"); return j; }); })
    .then(function(j){
      $("from").textContent = (j.name ? "Hi " + j.name + ", a message from " : "A message from ") + j.from;
      $("title").textContent = j.title; $("title").hidden = false;
      $("body").textContent = j.body; $("body").hidden = false;
      if(j.guides){ $("gpdf").href = j.guides.pdf; $("gvid").href = j.guides.video; $("guides").hidden = false; }
      $("when").textContent = "Sent " + new Date(j.sentAt).toLocaleString("en-AU", { weekday:"short", day:"numeric", month:"short", hour:"numeric", minute:"2-digit", timeZone:"Australia/Sydney" });
    })
    .catch(function(e){ $("from").innerHTML = '<span class="err">' + String(e.message).replace(/[<>&]/g, "") + "</span>"; });
})();
</script>
</body></html>
