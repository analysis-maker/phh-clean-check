<title>Professional Holiday Homes - Clean check feedback</title>
<style>
@font-face{font-family:"Raleway";font-style:normal;font-weight:100 900;font-display:swap;src:url("../raleway-latin.woff2") format("woff2")}
/* Owner side of PHH Clean Check. Same look as the cleaner app and the office view (PHH Landing Page v24). */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f8fb; --offset:#e8f0f6;
  --ink:#1a3a4a; --muted:#4f5c6b; --faint:#8a9bb0; --line:#c9d5df; --divider:#dce5ec;
  --primary:#2275b0; --accent:#21a6c7; --accent-hl:#d6edf4;
  --teal:#0e7c8f; --teal-hover:#0a6273; --teal-hl:#d7ebef;
  --warn:#b4541a; --warn-soft:#fbeee4;
  --radius:1rem; --radius-md:.5rem;
  --shadow:0 4px 12px rgba(34,117,176,.08), 0 2px 4px rgba(34,117,176,.05);
  --font:"Raleway", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-weight:500;font-variant-numeric:lining-nums;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:900px;margin:0 auto}
.nav{margin-inline:-16px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--divider);padding-top:calc(12px + env(safe-area-inset-top,0px))}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav img{display:block;height:32px;width:auto}
.nav .me{font-size:.85rem;color:var(--muted);text-align:right}
.nav .me a{color:var(--primary);font-weight:700;text-decoration:none;margin-left:8px}
h1,h2,h3{font-family:var(--font);text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:12px}
h2{font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:800}
.top{padding-block:20px 4px}
.meta{color:var(--muted);font-size:.95rem;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--accent-hl);border:1px solid rgba(33,166,199,.35);color:var(--primary);padding:6px 12px;border-radius:9999px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary)}
.cards{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
@media (min-width:720px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:grid;gap:8px;align-content:start}
.card .sub{font-size:.85rem;color:var(--muted)}
.kv{display:grid;gap:2px}
.kv .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.kv .v{font-weight:700}
.btn{display:block;text-align:center;font:inherit;font-weight:700;font-size:.92rem;border:2px solid var(--teal);border-radius:var(--radius-md);padding:10px 14px;background:var(--teal);color:#fff;text-decoration:none;margin-top:4px}
.btn:hover{background:var(--teal-hover);border-color:var(--teal-hover)}
.btn.ghost{background:var(--surface);color:var(--muted);border-color:var(--line);cursor:default}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.fbtn{font:inherit;font-size:.85rem;font-weight:700;padding:8px 14px;border-radius:9999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 0 10px}
.listhead .count{font-size:.85rem;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums}
ul.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
ul.rows li{border-top:1px solid var(--divider)}
ul.rows li:first-child{border-top:0}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;color:inherit;text-decoration:none}
a.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0;display:grid;gap:3px}
.row .prop{font-weight:800}
.row .sub{font-size:.85rem;color:var(--muted)}
.row .chev{flex:none;color:var(--faint);font-weight:700;font-size:1.3rem;line-height:1.2}
.tag{flex:none;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:9999px;padding:4px 10px;margin-top:2px;white-space:nowrap}
.tag.ok{color:var(--teal);background:var(--teal-hl)}
.tag.info{color:var(--primary);background:var(--accent-hl)}
.tag.plain{color:var(--muted);background:var(--offset)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{margin-top:12px;color:var(--muted);font-size:.9rem}
.err{color:var(--warn);font-weight:700}
.foot{margin-top:18px;font-size:.8rem;color:var(--faint)}
.pushbox{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:var(--radius-md);background:var(--teal-hl);border:1px solid rgba(14,124,143,.3);font-size:.9rem}
.pushbox .pushtxt{flex:1 1 180px}
.pushbtn{font:inherit;font-weight:700;font-size:.85rem;border:2px solid var(--teal);border-radius:var(--radius-md);padding:8px 14px;background:var(--teal);color:#fff;cursor:pointer}
.pushbtn.ghost{background:#fff;color:var(--teal)}
.pushbtn:disabled{opacity:.6}

/* Clean check feedback for the housekeeper (28 Oct 2026). Opened from a "Professional Holiday Homes" notification. */
.score{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;text-align:center}
.score .big{font-size:3rem;font-weight:800;letter-spacing:-.03em;color:var(--teal);line-height:1}
.score .big small{font-size:1.4rem;color:var(--faint);font-weight:700}
.score .dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.score .dots i{width:14px;height:14px;border-radius:50%;background:var(--offset);display:block}
.score .dots i.on{background:var(--teal)}
.score .word{margin-top:10px;font-weight:700;font-size:1.1rem}
.tips{margin-top:18px;background:var(--surface-2);border-radius:var(--radius);padding:16px 18px}
.tips h2{font-size:1.05rem;font-weight:800;margin:0 0 8px}
.tips ul{margin:0;padding-left:20px}
.tips li{margin:6px 0}
.sign{margin-top:18px;color:var(--muted)}
.back{display:inline-block;margin-top:16px;color:var(--teal);font-weight:700;text-decoration:none}
</style>
<script>
/* Self-update (tools/bump_build.py): if this copy is older than the live page, reopen it fresh.
   Runs on open, whenever the app comes back to the front (iPhone keeps Home Screen apps suspended), and every 10 minutes. */
(function(){
  try{
    var me = document.querySelector('meta[name="phh-build"]'); if(!me || !window.fetch) return;
    var b = me.getAttribute("content"), busy = false, last = 0;
    function check(){
      if(busy || Date.now() - last < 20000) return; busy = true; last = Date.now();
      var sep = location.search ? "&" : "?";
      fetch(location.pathname + location.search + sep + "_chk=" + Date.now(), { cache: "no-store", credentials: "same-origin" })
        .then(function(r){ return r.ok ? r.text() : ""; })
        .then(function(t){
          busy = false;
          var m = /name="phh-build" content="([0-9]+)"/.exec(t || ""); if(!m || m[1] <= b) return;
          var key = "phh-upd-" + m[1]; try{ if(sessionStorage.getItem(key)) return; sessionStorage.setItem(key, "1"); }catch(x){}
          var q = (location.search || "").replace(/([?&])_v=[^&]*&?/, "$1").replace(/[?&]$/, "");
          location.replace(location.pathname + q + (q ? "&" : "?") + "_v=" + m[1] + location.hash);
        }).catch(function(){ busy = false; });
    }
    check();
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") check(); });
    window.addEventListener("pageshow", function(e){ if(e.persisted) check(); });
    window.addEventListener("focus", check);
    setInterval(function(){ if(document.visibilityState === "visible") check(); }, 600000);
  }catch(e){}
})();
</script>
</head><body>
<nav class="nav"><div class="wrap"><img src="../logo.png" alt="Professional Holiday Homes" width="172" height="32"></div></nav>
<div class="wrap">
  <header class="top">
    <span class="badge">Clean check feedback</span>
    <h1 id="prop">Your clean</h1>
    <p class="meta" id="meta">From Professional Holiday Homes</p>
  </header>
  <div id="result" hidden>
    <div class="score"><div class="big" id="big"></div><div class="dots" id="dots"></div><div class="word" id="word"></div></div>
    <div class="tips"><h2 id="tipsh">For next time</h2><ul id="tips"></ul></div>
    <p class="sign">Thank you for your work.<br><b>Professional Holiday Homes</b></p>
  </div>
  <p class="note" id="msg">Loading...</p>
  <a class="back" href="./">&lsaquo; Back to my cleans</a>
</div>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var API = window.PHH_PUSH_API;
  /* Opened from a notification: clear the address sw.js left, so "Back to my cleans" doesn't bounce back here. */
  if(window.caches) caches.open("phh-nav").then(function(c){ return c.delete("pending-nav"); }).catch(function(){});
  var id = new URLSearchParams(location.search).get("id") || "";
  var code = ""; try{ code = localStorage.getItem("phh-cleaner-code") || localStorage.getItem("phh-staff-code") || ""; }catch(e){}
  if(!code){ $("msg").textContent = "Open this from the Clean Check app on your phone, signed in with your code."; return; }
  var WORDS = { 5: "Excellent work", 4: "Great clean", 3: "Good clean, a few things to tighten up", 2: "Some areas need attention", 1: "This clean needs a second look" };
  fetch(API + "/my-review", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ code: code, id: id }) })
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || ("Error " + r.status)); return j; }); })
    .then(function(j){
      $("prop").textContent = j.property || "Your clean";
      if(j.cleanDate) $("meta").textContent = "From Professional Holiday Homes | " + new Date(j.cleanDate + "T12:00:00").toLocaleDateString("en-AU", { weekday:"long", day:"numeric", month:"long" });
      if(!j.ready){ $("msg").textContent = "Your feedback is not ready yet. Check back a bit later."; return; }
      var s = Number(j.score) || 0;
      $("big").innerHTML = s + "<small> / 5</small>";
      for(var i = 1; i <= 5; i++){ var d = document.createElement("i"); if(i <= s) d.className = "on"; $("dots").appendChild(d); }
      $("word").textContent = WORDS[s] || "";
      var ul = $("tips");
      (j.tips || []).forEach(function(t){ var li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
      if(!(j.tips || []).length){ $("tipsh").textContent = "Nothing to fix"; var li = document.createElement("li"); li.textContent = "Everything looked good. Keep it up."; ul.appendChild(li); }
      $("result").hidden = false; $("msg").textContent = "";
    })
    .catch(function(e){ $("msg").className = "note err"; $("msg").textContent = e.message; });
})();
</script>
</body></html>
