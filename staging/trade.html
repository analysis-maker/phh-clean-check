<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#5bbfb5">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script>window.PHH_REPORT_API = "https://rxhpnowszmetjxbwylil.supabase.co/functions/v1/report-api-staging";</script>
<title>Job for Professional Holiday Homes</title>
<style>
/* Trade job link (Batch 4 item 24, staging 8 Nov 2026). A tradesperson opens one job from a link (no app, no code),
   and marks it done with a note and up to 3 live photos. It updates Clean Check only. */
:root{
  color-scheme:light;
  --teal:#5bbfb5; --teal-ink:#23807a; --teal-soft:#e6f5f3;
  --bg:#f4f5f5; --ink:#26323a; --muted:#5d6b73; --faint:#8b979e; --line:#e1e5e7; --line-2:#eef1f2;
  --ok-ink:#2f5d12; --warn:#b2461d; --warn-soft:#fdece5;
  --font:"Roboto", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1f6f9a;outline-offset:2px}
.bar{background:var(--teal);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;font-weight:500;font-size:17px}
.bar img{height:26px;width:26px;border-radius:5px;background:#fff;padding:2px}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
.box{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-ink);font-weight:700}
h1{font-size:24px;font-weight:500;margin:2px 0 8px;line-height:1.2}
h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-ink)}
.issue{white-space:pre-wrap}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumbs img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--line-2)}
label.l{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],textarea{width:100%;padding:10px;border:1px solid #c8cfd3;border-radius:4px;background:#fff;min-height:44px}
textarea{min-height:100px;resize:vertical}
.ph{position:relative;display:block;border:1px dashed #b9c2c7;border-radius:6px;background:#fafbfb;cursor:pointer;overflow:hidden}
.ph.has{border-style:solid}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.ph .shot{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;color:var(--teal-ink);font-weight:500;text-align:center;padding:6px;font-size:14px}
.ph .cap{font-size:12px;padding:3px 6px;color:var(--muted)}
.ph .cap b{display:block;color:var(--warn);font-weight:500}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.btn{border:0;border-radius:4px;background:var(--teal);color:#fff;font-weight:500;padding:12px 18px;cursor:pointer;text-transform:uppercase;font-size:14px;letter-spacing:.04em;min-height:48px;width:100%;margin-top:14px}
.btn:disabled{opacity:.55;cursor:default}
.msg{color:var(--muted);margin:10px 0 0}
.msg.err{color:var(--warn);font-weight:500}
.done{background:#eaf5df;border-color:#cfe6b8;color:var(--ok-ink)}
.hint{color:var(--muted);font-size:14px;margin:0 0 6px}
.foot{color:var(--faint);font-size:13px;text-align:center}
</style>
</head><body>
<header class="bar"><img src="icon-180.png" alt="" width="26" height="26">Professional Holiday Homes</header>
<main>
  <p class="msg" id="msg">Loading...</p>
  <div id="job" hidden>
    <div class="box">
      <div class="kicker">Maintenance job</div>
      <h1 id="prop"></h1>
      <div class="issue" id="issue"></div>
      <div class="thumbs" id="issuePh"></div>
    </div>
    <div class="box done" id="doneBox" hidden>
      <h2>Marked done</h2>
      <p id="doneTxt"></p>
      <div class="thumbs" id="donePh"></div>
    </div>
    <form class="box" id="form" autocomplete="on">
      <h2>When the job is finished</h2>
      <p class="hint">Add a short note and up to 3 photos of the finished work, taken now with your camera. Then tap Mark job done.</p>
      <label class="l" for="name">Your name or business</label>
      <input type="text" id="name" maxlength="80" autocomplete="organization">
      <label class="l" for="note">What was done</label>
      <textarea id="note" maxlength="1000"></textarea>
      <label class="l">Photos (up to 3)</label>
      <div class="thumbs" id="phGrid"></div>
      <button class="btn" type="submit" id="go">Mark job done</button>
      <p class="msg" id="fMsg"></p>
    </form>
    <p class="foot" id="foot"></p>
  </div>
</main>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var API = window.PHH_REPORT_API || "";
  var t = new URLSearchParams(location.search).get("t") || "";
  var MAX_PHOTO_AGE_MIN = 15, IS_ANDROID = /Android/i.test(navigator.userAgent || "");
  var photos = [null, null, null], busy = 0, JOB = null;
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined && text !== null) e.textContent = text; return e; }
  function post(route, body){
    body = body || {}; body.t = t;
    return fetch(API + "/" + route, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || "Something went wrong. Try again."); return j; }); });
  }
  function when(ts){ return new Date(ts).toLocaleString("en-AU", { timeZone:"Australia/Sydney", day:"numeric", month:"short", year:"numeric", hour:"numeric", minute:"2-digit" }); }
  function thumbs(host, urls){ host.innerHTML = ""; urls.forEach(function(u, i){ var a = el("a"); a.href = u; a.target = "_blank"; a.rel = "noopener"; var im = el("img"); im.src = u; im.alt = "Photo " + (i + 1); a.appendChild(im); host.appendChild(a); }); }
  function say(m, err){ $("fMsg").className = "msg" + (err ? " err" : ""); $("fMsg").textContent = m || ""; }
  function load(){
    return post("trade", {}).then(function(j){
      JOB = j; $("msg").hidden = true; $("job").hidden = false;
      $("prop").textContent = j.property || "Property"; $("issue").textContent = j.issue || "";
      thumbs($("issuePh"), j.issuePhotos || []);
      if(j.done){
        $("form").hidden = true; $("doneBox").hidden = false;
        $("doneTxt").textContent = "By " + j.done.name + ", " + when(j.done.at) + ". " + j.done.note;
        thumbs($("donePh"), (j.photos || []).map(function(p){ return p.url; }).filter(Boolean));
        $("foot").textContent = "Thank you. Professional Holiday Homes has your note.";
      } else {
        (j.photos || []).forEach(function(p){ if(p.n >= 1 && p.n <= 3 && p.url) photos[p.n - 1] = { url: p.url, saved: true }; });
        tiles();
        $("foot").textContent = "This link works until " + when(j.expiresAt) + ".";
      }
    });
  }
  function tiles(){
    var g = $("phGrid"); g.innerHTML = "";
    for(var i = 0; i < 3; i++) g.appendChild(tile(i + 1, photos[i]));
  }
  function tile(n, x){
    var d = el("label", "ph" + (x && x.url ? " has" : ""));
    var inp = el("input"); inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture", "environment"); inp.setAttribute("aria-label", "Photo " + n);
    if(x && x.url){ var im = el("img"); im.src = x.url; im.alt = "Photo " + n; d.appendChild(im); }
    else d.appendChild(el("div", "shot", "+ Photo " + n));
    var cap = el("div", "cap", x && x.url ? (x.saved ? "Sent. Tap to retake." : "Sending...") : "");
    if(x && x.error) cap.appendChild(el("b", "", x.error));
    d.appendChild(cap); d.appendChild(inp);
    inp.addEventListener("change", function(e){ var f = e.target.files && e.target.files[0]; e.target.value = ""; if(f) take(n, f); });
    return d;
  }
  function take(n, file){
    var takenAt = null;
    file.slice(0, 131072).arrayBuffer().then(function(buf){ takenAt = exifDate(buf); }).catch(function(){}).then(function(){
      var w0 = takenAt || (file.lastModified > 1577836800000 ? new Date(file.lastModified) : null);
      if(w0 && (new Date() - w0) > MAX_PHOTO_AGE_MIN * 60000){ photos[n - 1] = { error: "Please take a new photo now with the camera." }; tiles(); return; }
      return decodePhoto(file).then(function(pic){
        var sc = Math.min(1, 1280 / Math.max(pic.w, pic.h)), w = Math.round(pic.w * sc), h = Math.round(pic.h * sc);
        var c = document.createElement("canvas"); c.width = w; c.height = h; var g = c.getContext("2d"); g.drawImage(pic.src, 0, 0, w, h); pic.done();
        var now = new Date(), band = Math.max(36, Math.round(h * 0.07));
        g.fillStyle = "rgba(0,0,0,.62)"; g.fillRect(0, h - band, w, band); g.fillStyle = "#fff"; g.font = "bold " + Math.round(band * 0.38) + "px sans-serif"; g.textBaseline = "middle";
        g.fillText("Job done " + n + "  |  " + (JOB.property || "") + "  |  " + when(now), Math.round(band * 0.3), h - band / 2);
        c.toBlob(function(blob){
          c.width = c.height = 0;
          var x = { url: URL.createObjectURL(blob), stampedAt: now.toISOString(), saved: false };
          photos[n - 1] = x; tiles(); send(n, x, blob, takenAt);
        }, "image/jpeg", 0.72);
      });
    }).catch(function(){ photos[n - 1] = { error: "That photo could not be read. Tap to take it again." }; tiles(); });
  }
  function send(n, x, blob, takenAt){
    busy++;
    post("trade-upload-url", { n: n }).then(function(j){
      return fetch(j.signedUrl, { method:"PUT", headers:{ "content-type":"image/jpeg" }, body: blob }).then(function(r){
        if(!r.ok) throw new Error("upload");
        return post("trade-photo", { n: n, path: j.path, stampedAt: x.stampedAt, takenAt: takenAt ? takenAt.toISOString() : null });
      });
    }).then(function(){ x.saved = true; x.error = null; })
      .catch(function(){ x.error = "Not sent yet. Check your signal and tap to take it again."; })
      .then(function(){ busy--; if(photos[n - 1] === x) tiles(); });
  }
  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var name = $("name").value.trim(), note = $("note").value.trim();
    if(busy) return say("Wait for the photos to finish sending.", true);
    if(name.length < 2) return say("Add your name or business name.", true);
    if(note.length < 3) return say("Add a short note about what was done.", true);
    $("go").disabled = true; say("Sending...");
    post("trade-done", { name: name, note: note }).then(load).then(function(){ window.scrollTo(0, 0); })
      .catch(function(err){ $("go").disabled = false; say(err.message, true); });
  });
  function exifDate(buf){
    try{
      var v = new DataView(buf); if(v.getUint16(0) !== 0xFFD8) return null;
      var off = 2;
      while(off < v.byteLength){
        var m = v.getUint16(off); off += 2;
        if(m === 0xFFE1){
          var start = off + 2; if(v.getUint32(start) !== 0x45786966) return null;
          var tt = start + 6, le = v.getUint16(tt) === 0x4949;
          var g16 = function(o){ return v.getUint16(o, le); }, g32 = function(o){ return v.getUint32(o, le); };
          var ifd = tt + g32(tt+4), exifPtr = 0, n = g16(ifd);
          for(var i=0;i<n;i++){ var q = ifd+2+i*12; if(g16(q) === 0x8769) exifPtr = tt + g32(q+8); }
          if(!exifPtr) return null;
          n = g16(exifPtr);
          for(var j=0;j<n;j++){
            var e2 = exifPtr+2+j*12;
            if(g16(e2) === 0x9003){ var so = tt + g32(e2+8), s = "";
              for(var k=0;k<19;k++) s += String.fromCharCode(v.getUint8(so+k));
              var p = s.split(/[: ]/).map(Number); return new Date(p[0], p[1]-1, p[2], p[3], p[4], p[5]); }
          }
          return null;
        }
        off += v.getUint16(off);
      }
    }catch(e){}
    return null;
  }
  function decodePhoto(file){
    function viaImg(){
      return new Promise(function(ok, bad){
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function(){ ok({ src:img, w:img.naturalWidth || img.width, h:img.naturalHeight || img.height, done:function(){ URL.revokeObjectURL(url); img.src = ""; } }); };
        img.onerror = function(){ URL.revokeObjectURL(url); bad(new Error("decode")); };
        img.src = url;
      });
    }
    if(IS_ANDROID && window.createImageBitmap){
      return createImageBitmap(file, { imageOrientation:"from-image" })
        .then(function(b){ return { src:b, w:b.width, h:b.height, done:function(){ try{ b.close(); }catch(e){} } }; })
        .catch(viaImg);
    }
    return viaImg();
  }
  if(!/^[A-Za-z0-9_-]{40,64}$/.test(t)){ $("msg").textContent = "This link is not valid. Please ask Professional Holiday Homes for a new one."; return; }
  load().catch(function(e){ $("msg").textContent = e.message; });
})();
</script>
</body></html>
