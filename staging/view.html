/* Self-update (tools/bump_build.py): if this copy is older than the live page, reopen it fresh.
   Runs on open, whenever the app comes back to the front (iPhone keeps Home Screen apps suspended), and every 10 minutes. */
(function(){
  try{
    var me = document.querySelector('meta[name="phh-build"]'); if(!me || !window.fetch) return;
    var b = me.getAttribute("content"), busy = false, last = 0;
    function check(){
      if(busy || Date.now() - last < 20000) return; busy = true; last = Date.now();
      var sep = location.search ? "&" : "?";
      fetch(location.pathname + location.search + sep + "_chk=" + Date.now(), { cache: "no-store", credentials: "same-origin" })
        .then(function(r){ return r.ok ? r.text() : ""; })
        .then(function(t){
          busy = false;
          var m = /name="phh-build" content="([0-9]+)"/.exec(t || ""); if(!m || m[1] <= b) return;
          var key = "phh-upd-" + m[1]; try{ if(sessionStorage.getItem(key)) return; sessionStorage.setItem(key, "1"); }catch(x){}
          var q = (location.search || "").replace(/([?&])_v=[^&]*&?/, "$1").replace(/[?&]$/, "");
          location.replace(location.pathname + q + (q ? "&" : "?") + "_v=" + m[1] + location.hash);
        }).catch(function(){ busy = false; });
    }
    check();
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") check(); });
    window.addEventListener("pageshow", function(e){ if(e.persisted) check(); });
    window.addEventListener("focus", check);
    setInterval(function(){ if(document.visibilityState === "visible") check(); }, 600000);
  }catch(e){}
})();

:root{

<script>
window.PHH_API = window.PHH_API || "";
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  var id = qs.get("id") || "";
  if(qs.get("from") === "officelist"){ var bo = $("back"); bo.href = "./"; bo.hidden = false; bo.style.margin = "0 0 12px"; bo.style.display = "block"; }
  if(qs.get("from") === "maint"){ var bm = $("back"); bm.href = "maintenance.html"; bm.hidden = false; bm.style.margin = "0 0 12px"; bm.style.display = "block"; }
  if(qs.get("from") === "office"){ var bk = $("back"), dt = qs.get("date") || ""; bk.href = "office.html" + (/^\d{4}-\d{2}-\d{2}$/.test(dt) ? "?date=" + dt : ""); bk.hidden = false; bk.style.margin = "0 0 12px"; bk.style.display = "block"; }
  /* Owner view: same record, without the office-only flags, booking number and HomHero job status. */
  var OWNER = qs.get("from") === "owner";
  if(OWNER){ var bo = $("back"); bo.href = "owner.html"; bo.textContent = "\u2039 Back to my properties"; bo.hidden = false; bo.style.margin = "0 0 12px"; bo.style.display = "block"; document.querySelector(".badge").textContent = "Clean report"; }
  function fmt(ts){ return ts ? new Date(ts).toLocaleString("en-AU",{timeZone:"Australia/Sydney",weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"}) : ""; }
  function chip(t, warn){ if(OWNER && warn) return; var c = document.createElement("span"); c.className = "chip" + (warn ? " warn" : ""); c.textContent = t; $("sum").appendChild(c); }
  function fail(m){ $("prop").textContent = "Clean check not found"; $("err").hidden = false; $("err").textContent = m; }
  if(!window.PHH_API || !id){ fail("This link is incomplete."); return; }
  fetch(window.PHH_API + "/view", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ id:id }) })
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || ("Error " + r.status)); return j; }); })
    .then(function(j){
      document.title = "Clean check - " + j.property;
      $("prop").textContent = j.property || "Clean check";
      $("when").textContent = "Completed " + fmt(j.submittedAt) + " (Sydney)";
      $("who").textContent = "By " + j.cleaner;
      $("res").textContent = OWNER ? "" : "Booking " + j.res;
      var n = 0; j.sections.forEach(function(s){ n += s.items.length; });
      chip(n + " checklist items" + (j.naCount && !OWNER ? " (" + j.naCount + " N/A)" : ""));
      chip(j.photos.length + " photos");
      if(j.firstPhotoAt && j.submittedAt){
        var mins = Math.round((new Date(j.submittedAt) - new Date(j.firstPhotoAt)) / 60000);
        if(mins >= 0){ var t = mins >= 60 ? Math.floor(mins/60) + " h " + (mins % 60) + " min" : mins + " min";
          chip("Clean time " + t + " (first photo " + new Date(j.firstPhotoAt).toLocaleTimeString("en-AU",{timeZone:"Australia/Sydney",hour:"numeric",minute:"2-digit"}) + " to Complete)"); }
      }
      if(j.consumables && !OWNER) chip("Consumables needed: " + (j.consumables === "yes" ? "Yes" : "No"), j.consumables === "yes");
      if(j.noBbq) chip("Marked as no BBQ", true);
      var mt = j.maintenance || [];
      if(mt.length) chip(mt.length + " maintenance issue" + (mt.length > 1 ? "s" : ""), true);
      if(j.oldPhotoCount) chip(j.oldPhotoCount + " photo" + (j.oldPhotoCount > 1 ? "s" : "") + " older than 12 hours", true);
      var rm = j.rooms || {};
      if(rm.bedrooms) chip(rm.bedrooms + " bed, " + rm.bathrooms + " bath photographed", (rm.hhBedrooms && rm.bedrooms < rm.hhBedrooms) || (rm.hhBathrooms && rm.bathrooms < rm.hhBathrooms));
      if(mt.length){
        $("maintsec").hidden = false; $("mtcount").textContent = String(mt.length);
        mt.forEach(function(m){
          var d = document.createElement("div"); d.className = "issue";
          d.innerHTML = '<div class="ihead"><span class="t"></span></div><p class="itext"></p><div class="photos"></div>';
          d.querySelector(".t").textContent = "Issue " + m.n;
          var h = d.querySelector(".ihead");
          if(m.urgent){ var u = document.createElement("span"); u.className = "chip warn"; u.textContent = "Urgent"; h.appendChild(u); }
          if(!OWNER){ var hj = document.createElement("span"); hj.className = "chip"; hj.textContent = m.hhJob ? "HomHero job " + m.hhJob : "Waiting to go into HomHero"; h.appendChild(hj); }
          d.querySelector(".itext").textContent = m.text;
          var ph = d.querySelector(".photos");
          (m.photos || []).forEach(function(p, k){
            var a = document.createElement("a"); a.className = "ph has"; a.target = "_blank"; a.rel = "noopener";
            if(p.url){ a.href = p.url; var im = document.createElement("img"); im.loading = "lazy"; im.alt = "Maintenance photo " + (k + 1); im.src = p.url; a.appendChild(im); }
            if(p.url){ a.addEventListener("click", function(e){ if(e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); window.phhViewer.open((m.photos || []).map(function(q, n){ return { url: q.url, label: "Maintenance photo " + (n + 1), sub: m.text || m.description || "" }; }), k); }); }
            var cap = document.createElement("div"); cap.className = "cap"; cap.textContent = fmt(p.stampedAt); a.appendChild(cap); ph.appendChild(a);
          });
          if(!(m.photos || []).length) ph.remove();
          $("issues").appendChild(d);
        });
      }
      $("photosec").hidden = false; $("phcount").textContent = String(j.photos.length);
      var gallery = [];
      j.photos.forEach(function(p){
        var a = document.createElement("a"); a.className = "ph has"; a.target = "_blank"; a.rel = "noopener";
        if(p.url){ a.href = p.url; var im = document.createElement("img"); im.loading = "lazy"; im.alt = p.label; im.src = p.url; a.appendChild(im); }
        var cap = document.createElement("div"); cap.className = "cap"; cap.textContent = p.label;
        var st = document.createElement("span"); st.className = "stamp"; st.textContent = fmt(p.stampedAt); cap.appendChild(st);
        if(p.oldPhoto && !OWNER){ var fl = document.createElement("span"); fl.className = "flag"; fl.textContent = "Photo file is older than 12 hours"; cap.appendChild(fl); }
        if(!p.url){ var f2 = document.createElement("span"); f2.className = "flag"; f2.textContent = "Photo file not found"; cap.appendChild(f2); }
        a.appendChild(cap); $("photos").appendChild(a);
        if(p.url){
          var idx = gallery.length;
          gallery.push({ url: p.url, label: p.label, sub: fmt(p.stampedAt), flag: p.oldPhoto && !OWNER ? "Photo file is older than 12 hours" : "" });
          a.addEventListener("click", function(e){ if(e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); window.phhViewer.open(gallery, idx); });
        }
      });
      j.sections.forEach(function(sec){
        var el = document.createElement("section"); el.className = "sec";
        el.innerHTML = '<div class="sechead"><h2></h2><span class="secount ok"></span></div>';
        el.querySelector("h2").textContent = sec.title; el.querySelector(".secount").textContent = String(sec.items.length);
        var ul = document.createElement("ul"); ul.className = "items";
        sec.items.forEach(function(it){
          var li = document.createElement("li"); li.className = "item ro " + (it.status === "na" ? "na" : "done");
          li.innerHTML = '<span class="box" aria-hidden="true"></span><span class="txt"></span>';
          li.querySelector(".box").textContent = it.status === "na" ? "N/A" : "\u2713";
          li.querySelector(".txt").textContent = it.text; ul.appendChild(li);
        });
        el.appendChild(ul); $("sections").appendChild(el);
      });
    })
    .catch(function(e){ fail(e.message); });
})();
</script>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lb-top"><span class="lb-count" id="lbCount"></span><button class="lb-close" id="lbClose" type="button" aria-label="Close photos">&times;</button></div>
  <div class="lb-track" id="lbTrack"></div>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous photo">&lsaquo;</button>
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next photo">&rsaquo;</button>
  <div class="lb-cap" id="lbCap"><b></b><span></span></div>
</div>
<script>
/* Photo viewer. window.phhViewer.open(list, index); list = [{url, label, sub, flag}] */
(function(){
  "use strict";
  var lb = document.getElementById("lb"), track = document.getElementById("lbTrack"), count = document.getElementById("lbCount");
  var cap = document.getElementById("lbCap"), prev = document.getElementById("lbPrev"), next = document.getElementById("lbNext");
  var list = [], cur = 0, lastFocus = null, ticking = false;
  function show(i){
    cur = Math.max(0, Math.min(list.length - 1, i));
    var p = list[cur] || {};
    count.textContent = (cur + 1) + " / " + list.length;
    cap.innerHTML = "<b></b><span></span>";
    cap.querySelector("b").textContent = p.label || "";
    cap.querySelector("span").textContent = p.sub || "";
    if(p.flag){ var f = document.createElement("span"); f.className = "flag"; f.textContent = p.flag; cap.appendChild(f); }
    prev.disabled = cur === 0; next.disabled = cur === list.length - 1;
  }
  function go(i, smooth){ track.scrollTo({ left: Math.max(0, Math.min(list.length - 1, i)) * track.clientWidth, behavior: smooth ? "smooth" : "auto" }); show(i); }
  function open(items, i){
    list = items.filter(function(p){ return p && p.url; });
    if(!list.length) return;
    lastFocus = document.activeElement;
    track.innerHTML = "";
    list.forEach(function(p, k){
      var d = document.createElement("div"); d.className = "lb-slide";
      var im = document.createElement("img"); im.alt = p.label || ("Photo " + (k + 1)); im.decoding = "async";
      if(Math.abs(k - i) <= 1) im.src = p.url; else im.dataset.src = p.url;
      d.appendChild(im); track.appendChild(d);
    });
    lb.hidden = false; document.body.classList.add("lb-open");
    requestAnimationFrame(function(){ go(i, false); });
    document.getElementById("lbClose").focus();
  }
  function close(){ lb.hidden = true; document.body.classList.remove("lb-open"); track.innerHTML = ""; if(lastFocus && lastFocus.focus) lastFocus.focus(); }
  track.addEventListener("scroll", function(){
    if(ticking) return; ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      var i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      if(i !== cur) show(i);
      /* load this photo and its neighbours */
      [i - 1, i, i + 1].forEach(function(k){ var s = track.children[k]; var im = s && s.querySelector("img"); if(im && im.dataset.src){ im.src = im.dataset.src; delete im.dataset.src; } });
    });
  }, { passive: true });
  prev.addEventListener("click", function(){ go(cur - 1, true); });
  next.addEventListener("click", function(){ go(cur + 1, true); });
  document.getElementById("lbClose").addEventListener("click", close);
  document.addEventListener("keydown", function(e){
    if(lb.hidden) return;
    if(e.key === "Escape") close();
    else if(e.key === "ArrowLeft") go(cur - 1, true);
    else if(e.key === "ArrowRight") go(cur + 1, true);
  });
  window.addEventListener("resize", function(){ if(!lb.hidden) go(cur, false); });
  window.phhViewer = { open: open };
})();
</script>
</body></html>
