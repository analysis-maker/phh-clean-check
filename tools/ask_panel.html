@media (max-width:640px){
  .aphh-panel{right:0;left:0;bottom:0;width:100%;height:calc(100% - 40px - env(safe-area-inset-top));border-radius:16px 16px 0 0;border-bottom:0}

</style>
<div class="aphh" id="aphh" hidden>

<script>
/* Ask PHH (assistant-api). Staff codes only; the server checks every call. Chat kept for this browser tab (sessionStorage). */
(function(){
  "use strict";
  var API = "https://rxhpnowszmetjxbwylil" + ".supabase.co/functions/v1/assistant-api/";
  var root = document.getElementById("aphh"); if(!root || !window.fetch) return;
  var $ = function(id){ return document.getElementById(id); };
  var PAGE = (location.pathname.split("/").pop() || "office").replace(/\.html$/, "") || "office";
  var CODE = "", ME = null, busy = false, H = [];
  var KEY = "phh-ask-chat", OPEN = "phh-ask-open";
  function load(){ try{ H = JSON.parse(sessionStorage.getItem(KEY) || "[]") || []; }catch(e){ H = []; } }
  function save(){ try{ sessionStorage.setItem(KEY, JSON.stringify(H.slice(-30))); }catch(e){} }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
  function el(t, c, txt){ var e = document.createElement(t); if(c) e.className = c; if(txt != null) e.textContent = txt; return e; }
  function post(route, body){
    body.code = CODE;
    return fetch(API + route, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) { var e = new Error(j.error || ("Something went wrong (" + r.status + ")")); e.status = r.status; throw e; } return j; }); });
  }
  /* Answers: escape everything, then allow **bold**, "- " lists and [label](page.html?...) links to our own pages only. */
  var SAFE = /^(office|maintenance|admin|view)\.html(\?[^\s"'<>]*)?$/;
  function inline(t){
    return esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, label, url){
      var u = url.replace(/&amp;/g, "&");
      return SAFE.test(u) ? '<a href="' + esc(u) + '">' + label + "</a>" : label;
    });
  }
  function md(t){
    var out = [], list = [];
    function flush(){ if(list.length){ out.push("<ul>" + list.map(function(x){ return "<li>" + inline(x) + "</li>"; }).join("") + "</ul>"); list = []; } }
    String(t || "").split(/\n/).forEach(function(line){
      var m = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(line);
      if(m){ list.push(m[1]); return; }
      flush(); if(line.trim()) out.push("<p>" + inline(line) + "</p>");
    });
    flush(); return out.join("");
  }
  var CHIPS = {
    admin: ["How many cleans did Sharon do last week?", "Who has the best housekeeping score this week?", "Show me missed checks yesterday", "Take me to Bluetongue's last clean", "Who has phone notifications on?", "How do I change a housekeeper's code?"],
    office: ["How many cleans did Sharon do last week?", "Who has the best housekeeping score this week?", "Show me missed checks yesterday", "Take me to Bluetongue's last clean", "Which cleans need attention today?", "What does Missing check mean?"],
    maintenance: ["What maintenance is open?", "Anything urgent this week?", "Show maintenance for Bluewater", "How do maintenance alerts work?"]
  };
  function hello(){
    var box = el("div", "aphh-hi");
    box.appendChild(el("span", "aphh-badge", "Ask PHH"));
    box.appendChild(el("p", "", "Hi " + String(ME.name).split(" ")[0] + ". Ask me about cleans, clean checks, AI scores" + (ME.role === "maintenance" ? ", maintenance or how something works." : ", maintenance or how something works. I'll link you to the right page.")));
    var chips = el("div", "aphh-chips");
    (CHIPS[ME.role] || CHIPS.office).forEach(function(q){ var b = el("button", "aphh-chip", q); b.type = "button"; b.addEventListener("click", function(){ ask(q); }); chips.appendChild(b); });
    box.appendChild(chips); return box;
  }
  function costLine(h){
    if(h.cost == null) return null;
    var t = "US$" + (h.cost < 0.01 ? h.cost.toFixed(3) : h.cost.toFixed(2)) + " for this answer";
    if(ME.admin && h.month != null) t += " | this month US$" + h.month.toFixed(2) + " of US$" + ME.cap;
    return el("span", "aphh-cost", t);

    var lt = el("label", "", "Title"); var ti = el("input"); ti.value = a.title; ti.maxLength = 60; ti.readOnly = true; lt.appendChild(ti);
    var lb = el("label", "", "Message"); var tb = el("textarea"); tb.value = a.body; tb.maxLength = 600; tb.readOnly = true; lb.appendChild(tb);

    if(a.phonesOff && a.phonesOff.length) c.appendChild(el("div", "aphh-note warn", "No phone notifications: " + a.phonesOff.join(", ") + ". They'll see it next time they open Clean Check, so call or text for anything urgent."));
    if(a.phonesOn && a.phonesOn.length) c.appendChild(el("div", "aphh-note", "Phone notification to: " + a.phonesOn.join(", ") + "."));
    c.appendChild(el("div", "aphh-note", a.testersOnly ? "Staging: Send goes to the testers only (Ian, Craig, Marson)." : "Ian, Craig and Marson get a copy. Comes from Professional Holiday Homes."));
    if(h.status){ c.appendChild(el("div", "aphh-done", h.status)); return c; }
    var row = el("div", "aphh-btns");
    var send = el("button", "aphh-btn", "Send"), edit = el("button", "aphh-btn ghost", "Edit"), cancel = el("button", "aphh-btn ghost", "Cancel");
    [send, edit, cancel].forEach(function(b){ b.type = "button"; row.appendChild(b); });
    edit.addEventListener("click", function(){ ti.readOnly = tb.readOnly = false; edit.hidden = true; tb.focus(); });
    function act(decision){
      send.disabled = edit.disabled = cancel.disabled = true;
      post("act", { id: h.id, decision: decision, title: ti.value, body: tb.value }).then(function(j){
        h.status = decision === "cancel" ? "Cancelled. Nothing was sent." : (j.testersOnly ? "Sent to the testers only (staging)." : "Sent. Track it in Admin, Messages.");
        a.title = ti.value; a.body = tb.value; save(); render();
      }).catch(function(e){ send.disabled = edit.disabled = cancel.disabled = false; row.appendChild(el("div", "aphh-note warn", e.message)); });
    }
    send.addEventListener("click", function(){ if(!ti.value.trim() || !tb.value.trim()) return; act("send"); });
    cancel.addEventListener("click", function(){ act("cancel"); });
    c.appendChild(row); return c;
  }
  function render(){
    var log = $("aphhLog"); log.innerHTML = "";
    log.appendChild(hello());
    H.forEach(function(h){
      log.appendChild(el("div", "aphh-q", h.q));
      if(h.err){ log.appendChild(el("div", "aphh-a err", h.err)); return; }
      if(h.a == null) return;
      var a = el("div", "aphh-a"); a.innerHTML = md(h.a); var cl = costLine(h); if(cl) a.appendChild(cl); log.appendChild(a);
      if(h.action && ME.admin) log.appendChild(card(h));
    });
    if(busy){ var w = el("div", "aphh-wait", "Looking that up"); w.appendChild(el("i")); w.appendChild(el("i")); w.appendChild(el("i")); log.appendChild(w); }
    log.scrollTop = log.scrollHeight;
  }
  function ask(q){
    q = String(q || "").trim(); if(!q || busy) return;
    var hist = H.filter(function(h){ return h.a && !h.err; }).slice(-4).map(function(h){ return { q: h.q, a: h.a }; });
    var h = { q: q }; H.push(h); busy = true; $("aphhIn").value = ""; size(); $("aphhGo").disabled = true; render(); save();
    post("ask", { page: PAGE, question: q, history: hist }).then(function(j){
      h.a = j.answer; h.id = j.id; h.cost = j.costUsd; h.month = j.monthUsd; h.action = j.action || null;
    }).catch(function(e){ h.err = e.status === 403 ? "Ask PHH is for PHH staff. Sign in again with your code." : e.message; })
      .then(function(){ busy = false; $("aphhGo").disabled = false; save(); render(); $("aphhIn").focus(); });
  }
  function size(){ var t = $("aphhIn"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; }
  function setOpen(o){
    $("aphhPanel").hidden = !o; $("aphhFab").hidden = o; $("aphhFab").setAttribute("aria-expanded", String(o));
    try{ sessionStorage.setItem(OPEN, o ? "1" : ""); }catch(e){}

  }
  function start(){
    post("hello", {}).then(function(j){
      ME = { name: j.name, role: j.role, admin: !!j.admin, cap: j.capUsd };
      root.hidden = false; load();
      if(!j.enabled) $("aphhFoot").textContent = "Ask PHH is being set up. Questions will work soon.";
      var o = ""; try{ o = sessionStorage.getItem(OPEN) || ""; }catch(e){}
      if(o) setOpen(true);
    }).catch(function(){ /* not a staff code: stay hidden */ });
  }
  $("aphhFab").addEventListener("click", function(){ setOpen(true); });
  $("aphhClose").addEventListener("click", function(){ setOpen(false); });
  $("aphhNew").addEventListener("click", function(){ H = []; save(); render(); $("aphhIn").focus(); });
  $("aphhForm").addEventListener("submit", function(e){ e.preventDefault(); ask($("aphhIn").value); });
  /* Following a link: keep the chat open on a computer, close it on a phone so the page is visible. */
  $("aphhLog").addEventListener("click", function(e){ var a = e.target.closest ? e.target.closest("a") : null; if(a){ try{ sessionStorage.setItem(OPEN, window.innerWidth <= 640 ? "" : "1"); }catch(x){} } });
  $("aphhIn").addEventListener("input", size);
  $("aphhIn").addEventListener("keydown", function(e){ if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(this.value); } });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !$("aphhPanel").hidden) setOpen(false); });
  /* Wait for a staff code (admin.html signs in on the page itself). */
  var tries = 0;
  (function wait(){
    try{ CODE = localStorage.getItem("phh-staff-code") || ""; }catch(e){ CODE = ""; }
    if(CODE) return start();
    if(++tries < 200) setTimeout(wait, 3000);
  })();
})();
</script>
